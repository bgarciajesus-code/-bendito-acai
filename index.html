
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bendito Açaí</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f3fc;
      color: #32134d;
    }
    header {
      background: #591c83;
      color: white;
      padding: 30px 15px;
      text-align: center;
    }
    main { padding: 20px; }
    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin: 16px 0;
      box-shadow: 0 2px 8px #0001;
    }
    button {
      background: #591c83;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      width: 100%;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Bendito Açaí 💜</h1>
    <p>O Chefe de TODOS!</p>
  </header>
  <main>
    <h2>Nosso cardápio</h2>
    <div class="card">
      <h3>Monte seu açaí</h3>
      <p>Escolha seu tamanho e adicionais.</p>
      <button onclick="alert('Cardápio em preparação!')">
        Montar meu açaí
      </button>
    </div>
  </main>
</body>
</html>
